name: Radar S and A source assurance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"
  pull_request:
    paths:
      - ".github/workflows/radar-sa-source-assurance.yml"
      - "GlobalNews/config/source_assurance_priorities.json"
      - "GlobalNews/config/source_sa_external_compare.json"
      - "GlobalNews/config/source_probe_candidates.json"
      - "GlobalNews/scripts/probe_sources.py"
      - "GlobalNews/scripts/run_source_probe.py"
      - "GlobalNews/tests/test_source_assurance_catalog.py"
      - "GlobalNews/tests/test_source_probe_catalogs.py"
      - "GlobalNews/tests/test_probe_sources.py"

permissions:
  contents: read

concurrency:
  group: radar-sa-source-assurance
  cancel-in-progress: false

jobs:
  probe-s-and-a-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROBE_OUTPUT_DIR: ${{ runner.temp }}/radar-sa-source-assurance-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: GlobalNews

    steps:
      - name: Check out source assurance definitions
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install "pytest>=7.4,<9"

      - name: Validate catalog contracts
        run: python -m pytest tests/test_source_assurance_catalog.py tests/test_source_probe_catalogs.py -q

      - name: Probe S and A sources
        shell: bash
        run: |
          python scripts/run_source_probe.py \
            --catalog config/source_sa_external_compare.json \
            --output-dir "${PROBE_OUTPUT_DIR}" \
            --attempts 2 \
            --timeout 20 \
            --delay 1
          cat "${PROBE_OUTPUT_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete source assurance bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-sa-source-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROBE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
